name: Terraform Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate -no-color

  terraform-plan:
    name: Plan
    needs: terraform-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="vm_count=1" \
            -var="vm_cores=4" \
            -var="vm_memory=4096" \
            -var="vm_disk_size=32" \
            -var="enable_debug_logging=false" \
            -no-color \
            -input=false \
            > /tmp/terraform-plan.txt

          echo "plan<<PLAN" >> $GITHUB_OUTPUT
          cat /tmp/terraform-plan.txt >> $GITHUB_OUTPUT
          echo "PLAN" >> $GITHUB_OUTPUT

      - name: Comment PR with Plan
        uses: actions/github-script@v7
        with:
          script: |
            const plan = `${{ steps.plan.outputs.plan }}`;
            const summary = `**Terraform Plan (Preview Mode)**\n\n\`\`\`\n${plan}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

  terraform-apply:
    name: Apply
    needs: terraform-plan
    runs-on: [self-hosted, proxmox]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      PM_API_URL: ${{ secrets.PM_API_URL }}
      PM_API_TOKEN_ID: ${{ secrets.PM_API_TOKEN_ID }}
      PM_API_TOKEN_SECRET: ${{ secrets.PM_API_TOKEN_SECRET }}
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Initialize Terraform
        run: terraform init

      - name: Terraform Apply
        run: |
          terraform apply \
            -var="ssh_public_key=${SSH_PUBLIC_KEY}" \
            -var="vm_password=${VM_PASSWORD}" \
            -var="enable_debug_logging=false" \
            -auto-approve \
            -input=false

      - name: Output VM Names
        run: terraform output vm_names